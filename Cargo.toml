[package]
name = "supertrackr"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
boringtun = { version = "=0.7.1", default-features = false }
libc = "0.2"
zeroize = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bencode = "0.2"
serde_bytes = "0.11"
sha2 = "0.10"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
statelessness = { git = "https://github.com/Jagalite/statelessness", rev = "0876717bee85e335449c2c99ada41f6c6e6112d1" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "util"] }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
statelessness-debug = { git = "https://github.com/Jagalite/statelessness", rev = "0876717bee85e335449c2c99ada41f6c6e6112d1" }
